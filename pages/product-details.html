<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopEase | Product Details</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<header>

    <nav>

        <h1>ShopEase</h1>

        <ul id="nav-links">

            <li>
                <a href="../index.html">Home</a>
            </li>

            <li>
                <a href="product.html">Products</a>
            </li>

            <li>
                <a href="cart.html">Cart</a>
            </li>

            <li>
                <a href="orders.html">My Orders</a>
            </li>

            <li>
                <a href="login.html">Login</a>
            </li>

        </ul>

    </nav>

</header>


<main>

<section class="product-details">

    <div class="product-details-image">

        <div class="product-image"
             id="product-image">

            Product Image

        </div>

    </div>


    <div class="product-details-info">

        <p id="product-category">
            Category
        </p>

        <h2 id="product-name">
            Product Name
        </h2>

        <div class="rating">
            ⭐⭐⭐⭐⭐
        </div>

        <p class="price"
           id="product-price">
            ₹0
        </p>

        <p id="product-description">
            Product description
        </p>


        <div class="quantity">

            <label for="quantity">
                Quantity:
            </label>

            <input
                type="number"
                id="quantity"
                value="1"
                min="1"
            >

        </div>


        <button
            class="add-cart"
            onclick="addProductFromDetails()">

            Add to Cart

        </button>

    </div>

</section>


<section class="product-info">

    <h2>Product Information</h2>

    <p id="product-info-text">
        Product information will appear here.
    </p>

</section>

</main>


<footer>

    <p>
        &copy; 2026 ShopEase. All rights reserved.
    </p>

</footer>


<script src="../js/script.js"></script>

</body>

</html>
